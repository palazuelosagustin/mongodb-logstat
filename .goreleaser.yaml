# Release builds: `git tag vX.Y.Z && git push origin vX.Y.Z` runs
# .github/workflows/release.yml, which runs this config.
# Local check without publishing: goreleaser release --snapshot --clean
version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: mongodb-logstat
    main: .
    binary: mongodb-logstat
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.buildVersion=v{{.Version}}
      - -X main.buildCommit={{.FullCommit}}
      - -X main.buildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  draft: false
  prerelease: auto
